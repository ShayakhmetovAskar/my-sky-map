server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shared collections are capability URLs — the token in the path is the credential.
    # Belt and braces for the <meta> tags the router sets (those only reach clients that
    # run JS; crawlers and link-preview bots see nothing but these headers).
    # Two nginx gotchas, both load-bearing:
    #   1. `add_header` in a location drops everything inherited from the server block,
    #      so the two server-level headers are repeated here.
    #   2. a *last* try_files argument is an internal redirect: it re-enters location
    #      matching, the response is generated in `location /`, and these headers are
    #      dropped. `/index.html` as a non-last argument is served from this location.
    location /s/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }
}
