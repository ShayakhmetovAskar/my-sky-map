services:
  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend_dev

  # --- Solver API ---
  solver-api:
    build: ./services/solver
    container_name: solver_api_dev
    environment:
      ROLE: api
      DATABASE_URL: postgresql+asyncpg://skymap_user:skymap_password@postgres:5432/skymap_db
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: skymap
      # Public HiPS bucket (APO-81): per-image sky tiles, anonymous GET on img/* only
      HIPS_ENDPOINT: host.docker.internal:9000
      HIPS_ACCESS_KEY: minioadmin
      HIPS_SECRET_KEY: minioadmin
      HIPS_BUCKET: skymap-static-data
      HIPS_PUBLIC_BASE_URL: http://localhost:9000/skymap-static-data
      ZITADEL_ISSUER_URL: http://host.docker.internal:8080
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:-}
    ports:
      - "8001:8000"
    volumes:
      - ./services/solver:/app
    depends_on:
      postgres:
        condition: service_healthy
      # The API writes to the public HiPS bucket too (purge on submission delete,
      # secret rotation on unshare), so it waits for the same one-shot init as the worker.
      minio-init:
        condition: service_completed_successfully

  # --- Solver Worker ---
  solver-worker:
    build: ./services/solver
    container_name: solver_worker_dev
    environment:
      ROLE: worker
      DATABASE_URL: postgresql+asyncpg://skymap_user:skymap_password@postgres:5432/skymap_db
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: skymap
      # Public HiPS bucket (APO-81): per-image sky tiles, anonymous GET on img/* only
      HIPS_ENDPOINT: host.docker.internal:9000
      HIPS_ACCESS_KEY: minioadmin
      HIPS_SECRET_KEY: minioadmin
      HIPS_BUCKET: skymap-static-data
      HIPS_PUBLIC_BASE_URL: http://localhost:9000/skymap-static-data
      SOLVER_BACKEND: online
      ASTROMETRY_API_KEY: ${ASTROMETRY_API_KEY:-}
      ENABLE_DOCS: "true"
    volumes:
      - ./services/solver:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_USER: skymap_user
      POSTGRES_PASSWORD: skymap_password
      POSTGRES_DB: skymap_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skymap_user -d skymap_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the buckets and the public-read policy for the sky tiles (APO-81).
  # The public bucket allows ONLY s3:GetObject on img/* — no anonymous listing, nothing
  # else readable (see docs/hips-storage.md; the same policy goes on the YC bucket).
  minio-init:
    image: minio/mc
    container_name: minio_init_dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/skymap
        mc mb --ignore-existing local/skymap-static-data
        cat > /tmp/hips-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::skymap-static-data/img/*"]
            }
          ]
        }
        POLICY
        mc anonymous set-json /tmp/hips-policy.json local/skymap-static-data
        mc anonymous get-json local/skymap-static-data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Nginx ---
  nginx_proxy:
    image: nginx:alpine
    container_name: skymap_nginx_dev
    volumes:
      - ./nginx/conf.dev.d:/etc/nginx/conf.d:ro
    ports:
      - "8889:80"
    depends_on:
      - frontend
      - solver-api

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
