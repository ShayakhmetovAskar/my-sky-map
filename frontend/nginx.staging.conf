server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shared collections are capability URLs — the token in the path is the credential.
    # Belt and braces for the <meta> tags the router sets. `add_header` in a location
    # drops everything inherited from the server block, so repeat those too.
    location /s/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
