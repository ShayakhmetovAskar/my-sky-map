server {
    listen 80;

    # Frontend
    location / {
        proxy_pass http://vite_frontend_dev:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Solver API — one location for the whole prefix (APO-88).
    #
    # This used to be a location per router (/submissions, /tasks, /stars, ...), which meant
    # every new router silently 404'd in dev until someone remembered to add it here. The
    # trailing slash on both sides strips /api/v1: /api/v1/public/sky/X -> /public/sky/X,
    # matching the app's root_path.
    location /api/v1/ {
        proxy_pass http://solver_api_dev:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
